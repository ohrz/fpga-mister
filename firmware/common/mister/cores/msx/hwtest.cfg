# hwtest.py msx: a ROM game started from MSX-DOS (boot.vhd, built by games.sh from roms/)
# No game images are part of this repository: put your own legally obtained ROM into roms/
# and set its 8.3 name below.
rbf     = _Computer/MSX.rbf
wait    = 25
text    = romload GAME.ROM /r\n
settle  = 15
# VDP: 21.477 MHz / (1368 * 262)
fps     = 59.92
measure = 30
