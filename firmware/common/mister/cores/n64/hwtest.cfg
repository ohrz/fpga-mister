# hwtest.py n64: a PAL game with the PAL PIF ROM (games/N64/boot1.rom), title and demo
# No game images are part of this repository: put your own legally obtained image into
# /media/fat/games/N64/ on the card and set its name below.
rbf     = _Console/N64.rbf
game    = <PAL game>.z64
index   = 1
wait    = 20
settle  = 5
# PAL VI at the PAL video clock: 49.655963 MHz / (1589 * 625) = 50.00 Hz (ascal input frames;
# 49.98 Hz measured with the VS counter of sys_top). The core clock runs free
# (G_FREE_CLK): perf.py shows 100 % edges, the game speed comes from tools/n64speed.py
fps     = 50.0
measure = 30
