# hwtest.py snes: a PAL GSU-2 game into its first level (the pad sequence fits the game used
# during development and must be adapted to another game)
# No game images are part of this repository: put your own legally obtained image into
# /media/fat/games/SNES/ on the card and set its name below.
rbf     = _Console/SNES.rbf
game    = <PAL GSU-2 game>.sfc
wait    = 12
pad     = 2 START 3 START 6 START 6 START 4 A 3 A 3 A 2 A 2 A 2 A 2 START 3 A 4 A 6
settle  = 3
# PAL clock (pll_cfg PAL -> pacer ratio G_PACE_NUM_ALT/DEN_ALT): 21.28137 MHz / (1364 * 312)
pacer   = alt
fps     = 50.007
measure = 30
