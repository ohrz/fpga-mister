# hwtest.py psx: a PAL game from its CUE into the intro (DRAFT, not run yet)
# No game images are part of this repository: put your own legally obtained image into
# /media/fat/games/PSX/ on the card and set its name below.
# Main_MiSTer loads the BIOS images games/PSX/boot*.rom at core start (your own BIOS images, US, JP, EU); the CUE is
# mounted as CD (PSX.sv "S1,CUECHD": type s, index 1), the region of the CD (EU) selects the PAL video
# clock (isPal -> pll_cfg.vhd).  No input: the BIOS logo and the game intro run on their own.
rbf     = _Console/PSX.rbf
game    = <PAL game>/<PAL game>.cue
type    = s
index   = 1
wait    = 40
settle  = 5
# PAL GPU timing on clk_vid (pll2 PAL MMCM, +32 ppm), progressive picture: 53.205128 MHz / (3406 * 314);
# an interlaced screen (312/313 lines per field) would give 49.987 Hz
fps     = 49.748
measure = 30
